# Render blueprint for FarmLink — MUST live at the repository root.
# The root .python-version file pins Render's build/runtime Python version.
# Deploy: Render Dashboard → New → Blueprint → select this repo.
# After deploy, set the `sync: false` secrets below in the dashboard
# (MONGODB_URI from Atlas, CORS_ORIGINS = your Vercel URL).
services:
  - type: web
    name: farmlink-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Atlas SRV string — paste in Render dashboard (secret)
      - key: MONGODB_DB
        value: farmlink
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        sync: false # e.g. https://farmlink.vercel.app — paste after Vercel deploy
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_MB
        value: 5
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
